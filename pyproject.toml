[build-system]
requires = ["setuptools >= 77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-image-extractor"
version = "0.1.0"
description = "CLI tool to extract embedded images from PDF, DOCX, PPTX and XLSX files."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Jose Leonardo Murillo Avalos" }
]
keywords = [
  "python",
  "cli",
  "pdf",
  "docx",
  "pptx",
  "xlsx",
  "image-extraction",
  "automation",
  "document-processing"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Utilities"
]
dependencies = [
  "python-docx>=1.2.0,<2.0.0",
  "PyMuPDF>=1.26.0,<2.0.0",
  "Pillow>=10.3.0,<13.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2.0",
  "twine>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/LeoMurilloDev/document-image-extractor"
Repository = "https://github.com/LeoMurilloDev/document-image-extractor"
Issues = "https://github.com/LeoMurilloDev/document-image-extractor/issues"

[project.scripts]
document-image-extractor = "document_image_extractor.app:main"

[tool.setuptools.packages.find]
include = ["document_image_extractor*"]
exclude = ["tests*"]